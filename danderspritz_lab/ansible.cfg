[defaults]
inventory = inventory/hosts.yml
roles_path = roles
host_key_checking = False
retry_files_enabled = False
# Pretty YAML task output (the old `stdout_callback = yaml` plugin was removed in
# community.general 12; this is the supported replacement on ansible-core >=2.13).
result_format = yaml
# Long Windows reboots / service-pack installs need a generous timeout.
timeout = 60

[persistent_connection]
connect_timeout = 60
command_timeout = 60
