---
# DanderSpritz lab inventory (Proxmox + Ansible edition).
#
# Two logical phases:
#   * build.yml     runs against the control node and talks to the Proxmox API
#                   (community.general.proxmox_kvm) to create the VMs.
#   * configure.yml runs against the Windows guests over WinRM.
#
# The Windows IPs are static and set by the answer files / Proxmox config, so
# they are known before the guests exist.
all:
  children:
    # The machine that runs Ansible and reaches the Proxmox API. Usually
    # localhost; override ansible_host if you drive a remote node.
    control:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"

    # All three Windows guests, reached over WinRM. Plays target hosts by name
    # (hosts: dc / target / danderspritz).
    windows:
      hosts:
        dc:
          ansible_host: 192.168.40.2
        target:
          ansible_host: 192.168.40.3
        danderspritz:
          ansible_host: 192.168.40.4
