---
# ---------------------------------------------------------------------------
# Lab-wide facts. Single source of truth for the network, domain and creds.
# ---------------------------------------------------------------------------

# Where the original scripts/answer_files live (one level up from this playbook).
lab_repo_root: "{{ playbook_dir }}/.."
windows_scripts_dir: "{{ lab_repo_root }}/scripts"
answer_files_dir: "{{ lab_repo_root }}/answer_files"

# On-guest staging directory the scripts are copied to before they run.
guest_stage_dir: 'C:\lab'

# Vendored installers delivered on a "tools" CD (built from tools_dir and
# attached to any VM with tools_iso: true), so they don't crawl over WinRM and
# don't depend on rot-prone URLs. src = filename in ../tools/; dest = exactly
# where the matching Install-*.ps1 expects it on the guest (the scripts now use
# the local file if present and fall back to downloading if not).
tools_dir: "{{ lab_repo_root }}/tools"
# Anchored (&dsz_tools) so the danderspritz VM can reference this exact list as
# its vendored_tools without duplicating it (see lab_vms below).
danderspritz_tools: &dsz_tools
  - src: "jre-6u21-windows-i586.exe"
    dest: 'C:\Windows\Temp\jre6u14.exe'
    sha256: "3f97d83c3c822a78d3a486da42f814bfaf3296d747a43ab3566f6ac983a009c6"
  - src: "python-2.6.6.msi"
    dest: 'C:\Windows\Temp\python-2.6.6.msi'
    sha256: "1192931440475d07fb3e9724531a53de34097ad24e519bff2e5f458c375a31b3"
  - src: "pywin32-221.win32-py2.6.exe"
    dest: 'C:\Windows\Temp\pywin32-py2.6.exe'
    sha256: "82b62e100802db25607829b259fc9a61289761a0536e25075ca189b94949ac7c"

# PowerShell 5.1 bootstrap for the COLD 2008 R2 / Win7 boxes. Modern
# ansible.windows modules require PS 5.1, but those OSes ship PS 2.0 and a cold
# PS 2.0 box cannot TLS-download installers (no TLS 1.2). So .NET 4.5.2 then WMF
# 5.1 are vendored in tools/ and installed from the tools CD AT FIRST LOGON (see
# the 2k8R2/w7 answer files), so the box presents PS 5.1 the first time Ansible
# connects. Order matters: WMF 5.1 requires .NET 4.5.2 already present.
# WMF 5.1 downloads as Win7AndW2K8R2-KB3191566-x64.zip — extract the .msu into
# tools/ with exactly this name. Both are gitignored (too big for the repo).
windows_bootstrap_tools: &bootstrap_tools
  - src: "NDP452-KB2901907-x86-x64-AllOS-ENU.exe"
    dest: 'C:\Windows\Temp\NDP452.exe'
    sha256: "6c2c589132e830a185c5f40f82042bee3022e721a216680bd9b3995ba86f3781"
  - src: "Win7AndW2K8R2-KB3191566-x64.msu"
    dest: 'C:\Windows\Temp\WMF51.msu'
    # From the official download.microsoft.com package (Win7AndW2K8R2-KB3191566-x64.zip, 68076477 bytes).
    sha256: "c51abfc65dff5f6858c0b9f6420caa0c166df7a6d8b484f8a3c68ea99f0032b0"

# DanderSpritz/FuzzBunch toolset. ~200 MB zipped — too big for the repo or LFS,
# so build.yml downloads it once on the control node and bakes it onto the tools
# CD; the guest expands it from the CD instead of git-cloning (no git/internet
# needed on the guest). The upstream repo has been dormant for ~9 years, so the
# master archive is effectively a fixed snapshot; pin a commit (.../zip/<sha>)
# only if you want to guard against that changing. Set fetch_eqgrp: false on a
# VM to skip the download and let the guest fall back to `git clone`.
eqgrp_url: "https://codeload.github.com/x0rz/EQGRP_Lost_in_Translation/zip/refs/heads/master"
eqgrp_zip_name: "EQGRP_Lost_in_Translation-master.zip"
eqgrp_cache_dir: "{{ proxmox_vm_build_dir }}/cache"

# Windows 7 SP1 (KB976932, x64) for the target. Microsoft REMOVED the original
# download, so the live URL in the old Install-SP1.ps1 is dead. The target's
# answer-file build fetches it (build.yml -> proxmox_vm, fetch_sp1: true) onto
# the target's tools CD: a copy vendored in tools/ is preferred, otherwise it is
# downloaded from the Internet Archive and SHA-256-verified. On an already-built
# target with no CD, the target role instead downloads it on the guest (also
# SHA-256-verified) — so SP1 works with or without a rebuild. Install-SP1.ps1
# only runs the staged, verified file; it never downloads.
# sp1_url points at a dedicated Internet Archive *item* (not a Wayback capture —
# those truncate ~900 MB files): its archive-computed MD5 (28d3932f…) and size
# (947,070,088) match the published values, so it is the genuine installer.
# Every path (build-side get_url, guest-side win_get_url) SHA-256-verifies the
# file against sp1_sha256, so a corrupt download is caught, not installed.
sp1_url: "https://archive.org/download/windows6.1-kb976932-x64_74865ef2562006e51d7f9333b4a8d45b7a749dab/windows6.1-kb976932-x64.exe"
sp1_file_name: "windows6.1-KB976932-X64.exe"
sp1_sha256: "f4d1d418d91b1619688a482680ee032ffd2b65e420c6d2eaecf8aa3762aa64c8"
sp1_cache_dir: "{{ eqgrp_cache_dir }}"

# --- Network -----------------------------------------------------------------
lab_domain: windomain.local
lab_netbios: WINDOMAIN
lab_subnet: "192.168.40"
lab_netmask: 24
lab_gateway: "192.168.40.1"
lab_dc_ip: "192.168.40.2"
lab_target_ip: "192.168.40.3"
lab_dsz_ip: "192.168.40.4"
# Upstream resolvers used by hosts that are not the DC.
lab_dns_upstream:
  - "1.1.1.1"
  - "8.8.8.8"

# --- Credentials -------------------------------------------------------------
# NOTE: these are the lab's intentionally-weak default creds (vagrant:vagrant),
# matching the answer files. The lab is deliberately vulnerable and must stay on
# an isolated network. Override lab_admin_password in vault for anything less
# throwaway than a scratch lab.
lab_admin_user: vagrant
lab_admin_password: vagrant

# ---------------------------------------------------------------------------
# Proxmox connection + VM placement.
#
# Auth is either an API token (default, recommended) or a username+password.
# The secret (token secret OR password) can come from a vault.yml, from
# -e proxmox_secret_prompt=..., or be typed at the hidden prompt build.yml shows.
#   proxmox_auth_method: token    -> uses proxmox_api_user + proxmox_api_token_id
#                                    + the secret as the token secret
#   proxmox_auth_method: password -> uses proxmox_api_user + the secret as the
#                                    password (PVE realm included, e.g. root@pam)
# ---------------------------------------------------------------------------
proxmox_auth_method: token
proxmox_api_host: "proxmox.lab.local"
proxmox_api_user: "root@pam"
proxmox_api_token_id: "ansible"     # token mode only
# The secret is NOT stored here. Provide it one of three ways:
#   - type it at the hidden prompt when build.yml runs, or
#   - -e proxmox_secret_prompt='...'  (unattended), or
#   - define the matching var in group_vars/vault.yml and press Enter at the
#     prompt: proxmox_api_token_secret (token) / proxmox_api_password (password)
proxmox_node: "pve"
proxmox_validate_certs: false

# Storage that already holds the pre-staged ISOs and will hold VM disks.
proxmox_iso_storage: "local"       # content type: iso
proxmox_disk_storage: "local-lvm"  # content type: images

# How the lab VMs are put on the network. Pick one:
#   managed  - the playbook creates a dedicated isolated bridge (roles/proxmox_net)
#              named proxmox_lab_bridge, and you add the host NAT so the guests
#              reach the internet (default; see proxmox.md). The PVE host routes.
#   existing - attach to an existing bridge (proxmox_lab_bridge) untagged; the
#              playbook does NOT touch host networking. You own the routing/NAT.
#   tagged   - attach to an existing bridge with VLAN tag lab_vlan, and run your
#              OWN firewall VM (pfSense/IPFire/OPNsense/...) on that VLAN as the
#              lab's gateway/NAT/DHCP. The playbook does NOT touch host networking
#              and creates no bridge. This is the "bring your own firewall" model.
#   routed   - the playbook builds a tiny Debian LXC that IS 192.168.40.1: NAT
#              out via lab_gateway_wan_bridge, DHCP+DNS on the isolated bridge.
#              Isolated AND internet-connected with NO host NAT and nothing for
#              you to hand-build. Requires root SSH from the control node to the
#              PVE node (gateway.yml runs there via pct/pveam/pvesh).
lab_network_mode: managed

# --- routed mode: auto-built NAT gateway LXC --------------------------------
# SSH to the PVE node (used only by gateway.yml in routed mode).
proxmox_node_ssh_host: "{{ proxmox_api_host }}"
proxmox_node_ssh_user: "root"
lab_gateway_vmid: 900
lab_gateway_hostname: "dsz-gw"
lab_gateway_wan_bridge: "vmbr0"          # bridge with internet, becomes the LXC's WAN (DHCP)
lab_gateway_rootfs_storage: "local-lvm"  # storage for the LXC rootfs (override to e.g. local-zfs)
lab_gateway_template_storage: "local"    # storage holding the LXC template (vztmpl content)
lab_gateway_cores: 1
lab_gateway_memory: 512
lab_gateway_rootfs_gb: 2
lab_dhcp_range_start: "192.168.40.100"   # DHCP pool, kept clear of the static .2/.3/.4
lab_dhcp_range_end: "192.168.40.150"
# Internal networks the lab is reached FROM that are NOT the gateway's own mgmt
# subnet — excluded from NAT so their return path isn't masqueraded. Add your
# control host's subnet here when it's routed (a different LAN) rather than on
# the gateway's WAN segment, e.g. ["192.168.69.0/24"].
lab_gateway_extra_route_nets: []

# VLAN id for 'tagged' mode (e.g. 40). Ignored in the other modes.
lab_vlan: ""

# The bridge the VMs attach to. In 'managed' mode the playbook creates it (must
# be vmbrN and free); in 'existing'/'tagged' mode set it to YOUR existing bridge
# (e.g. vmbr0). It must not be bridged to anything you care about (managed mode),
# or VLAN lab_vlan must be isolated upstream (tagged mode).
proxmox_lab_bridge: "vmbr40"

# virtio-win driver ISO, pre-staged into proxmox_iso_storage. Injected into the
# windowsPE pass so Setup can see a virtio-scsi disk.
proxmox_virtio_iso: "virtio-win.iso"

# Which VMs build.yml acts on. Empty or "all" = every VM in lab_vms (the
# default). Override on the command line to build a subset without editing this
# file, e.g.:
#   ansible-playbook build.yml -e lab_vm_filter=danderspritz
#   ansible-playbook build.yml -e lab_vm_filter=dc,target
# Accepts a comma-separated string or a YAML/JSON list. Names must match
# lab_vms[].name; an unknown name fails the run early.
lab_vm_filter: "all"

# ---------------------------------------------------------------------------
# Per-VM definitions consumed by build.yml -> role: proxmox_vm.
# iso = the Windows install media, pre-staged into proxmox_iso_storage.
# os_short = key into the per-OS virtio driver paths (see proxmox_vm defaults).
# ---------------------------------------------------------------------------
lab_vms:
  - name: dc
    vmid: 940
    iso: "7601.17514.101119-1850_x64fre_server_eval_en-us-GRMSXEVAL_EN_DVD.iso"
    iso_sha256: "30832ad76ccfa4ce48ccb936edefe02079d42fb1da32201bf9e3a880c8ed6312"
    answer_file: "2008_r2/Autounattend.xml"
    os_short: "2k8R2"
    ostype: "win7"           # Proxmox qm ostype (no w2008r2 key; win7 era)
    memory: 2048
    cores: 2
    disk_gb: 40
    ip: "{{ lab_dc_ip }}"
    mac: "02:00:00:40:00:02"
    computer_name: "dc"
    tools_iso: true             # CD carrying the PS 5.1 bootstrap installers
    vendored_tools: *bootstrap_tools  # .NET 4.5.2 + WMF 5.1, installed at first logon
    bootstrap_ps5: true         # also put bootstrap-ps5.cmd on the CD (runs the installs)

  - name: target
    vmid: 941
    iso: "7600.16385.090713-1255_x64fre_enterprise_en-us_EVAL_Eval_Enterprise-GRMCENXEVAL_EN_DVD.iso"
    iso_sha256: "2c16c73388a5c02a0ec4cd8b9e5c14ba28b7b45d13d0c9c7d44459feecc0385f"
    answer_file: "7/Autounattend.xml"
    os_short: "w7"
    ostype: "win7"
    memory: 2048
    cores: 2
    disk_gb: 40
    ip: "{{ lab_target_ip }}"
    mac: "02:00:00:40:00:03"
    computer_name: "target"
    tools_iso: true          # attach a tools CD (carries the small PS 5.1 bootstrap)
    vendored_tools: *bootstrap_tools  # .NET 4.5.2 + WMF 5.1, installed at first logon
    bootstrap_ps5: true      # also put bootstrap-ps5.cmd on the CD (runs the installs)
    # SP1 is NOT put on the CD (that would make a ~1 GB tools ISO, and the PVE API
    # upload buffers the whole file). The target role installs SP1 later over the
    # network via win_get_url (sp1_url) once PS 5.1 is up — set fetch_sp1: true
    # only if you specifically want it baked onto the CD and your node can take
    # the large upload.
    fetch_sp1: false

  - name: danderspritz
    vmid: 942
    iso: "10240.16384.150709-1700.TH1_CLIENTENTERPRISEEVAL_OEMRET_X64FRE_EN-US.ISO"
    iso_sha256: "9b53e1f6ab6259a05d0e8f42db5baad50b57da34da9312783f7e8bd4ae2cd3ca"
    answer_file: "10/Autounattend.xml"
    os_short: "w10"
    ostype: "win10"
    memory: 4096
    cores: 2
    disk_gb: 60
    ip: "{{ lab_dsz_ip }}"
    mac: "02:00:00:40:00:04"
    computer_name: "danderspritz10"
    tools_iso: true          # attach the vendored-installers CD (danderspritz_tools)
    vendored_tools: *dsz_tools  # the jre/python/pywin32 installers staged onto that CD
    fetch_eqgrp: true         # download the DanderSpritz toolset and add it to that CD
