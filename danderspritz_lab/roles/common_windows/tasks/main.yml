---
# Preparation common to all three guests. Replaces the shared Packer steps:
# vm-guest-tools.bat -> qemu-guest-agent, enable-rdp.bat, Install-Chocolatey.ps1.
# (vagrant-ssh.bat is dropped - Ansible uses WinRM.)

# NOTE: WinRM reachability (network profile = Private, the 5985 firewall rule,
# the HTTP listener, MaxEnvelopeSizekb and the service) is configured ONCE at
# first logon by the answer files (roles/proxmox_vm/templates/*.j2). It is NOT
# re-asserted here over WinRM every run: doing that reconfigured the WinRM
# service/config through the very connection in use and dropped the pipelined
# session (hangs / 413). A box built before those answer-file fixes needs the
# settings applied on its console once (see README "Known rough edges").

# --- Stage the repo scripts/ tree ------------------------------------------
# win_copy of the whole tree (121 files) over WinRM is pathologically slow and
# can appear to hang for hours — each file is a separate base64 round-trip.
# Instead: zip once on the control node, push the single archive, expand it on
# the guest with win_unzip (version-proof: it falls back to the Shell COM
# object on PowerShell 2.0 / Win7 / 2008 R2, which have no Expand-Archive),
# then normalise into the stage dir with robocopy (built in on every target OS)
# so the layout matches the old win_copy regardless of how the zip nests.
- name: "Create a temp zip of scripts/ on the control node"
  ansible.builtin.tempfile:
    state: file
    suffix: ".zip"
  register: _scripts_zip
  delegate_to: localhost
  run_once: true

- name: "Archive scripts/ into that single zip"
  community.general.archive:
    path: "{{ windows_scripts_dir }}/"
    dest: "{{ _scripts_zip.path }}"
    format: zip
    force_archive: true
  delegate_to: localhost
  run_once: true

- name: "Push the single zip to the guest"
  ansible.windows.win_copy:
    src: "{{ _scripts_zip.path }}"
    dest: 'C:\Windows\Temp\scripts-stage.zip'

- name: "Clear any previous extraction temp on the guest"
  ansible.windows.win_file:
    path: 'C:\Windows\Temp\scripts-stage'
    state: absent

- name: "Expand the zip on the guest (version-proof)"
  community.windows.win_unzip:
    src: 'C:\Windows\Temp\scripts-stage.zip'
    dest: 'C:\Windows\Temp\scripts-stage'
    delete_archive: true

- name: "Normalise the extracted tree into the stage dir"
  ansible.windows.win_shell: |
    $src = 'C:\Windows\Temp\scripts-stage'
    if (Test-Path (Join-Path $src 'scripts')) { $src = Join-Path $src 'scripts' }
    $dest = '{{ guest_stage_dir }}\scripts'
    New-Item -ItemType Directory -Path $dest -Force | Out-Null
    robocopy "$src" "$dest" /E /NFL /NDL /NJH /NJS /NP | Out-Null
    # robocopy uses exit codes 0-7 for success; 8+ is a real failure.
    if ($LASTEXITCODE -ge 8) { exit $LASTEXITCODE } else { exit 0 }
  changed_when: true

- name: "Verify a known script landed in the stage dir"
  ansible.windows.win_stat:
    path: '{{ guest_stage_dir }}\scripts\Install-Chocolatey.ps1'
  register: _scripts_check
  failed_when: not _scripts_check.stat.exists

- name: "Remove the control-node temp zip"
  ansible.builtin.file:
    path: "{{ _scripts_zip.path }}"
    state: absent
  delegate_to: localhost
  run_once: true

# --- Network profile = Private (lab posture) --------------------------------
# Set here, over WinRM on PS 5.1, rather than in the answer file: inline
# PowerShell in FirstLogonCommands proved unreliable. This only flips the
# Network List Manager category (0 Public -> 1 Private); it does NOT touch the
# WinRM service/listener, so it cannot drop the connection the way the old
# self-heal did. A promoted/joined box is already category 2 (Domain) and is
# left alone. No apostrophes in these comments (win_shell is free-form).
- name: "Set the network profile to Private"
  ansible.windows.win_shell: |
    try {
      $nlm = [Activator]::CreateInstance([Type]::GetTypeFromCLSID([Guid]'DCB00C01-570F-4A9B-8D69-199FDBA5723B'))
      foreach ($c in @($nlm.GetNetworkConnections())) {
        $net = $c.GetNetwork()
        if ($net.GetCategory() -eq 0) { $net.SetCategory(1) }
      }
    } catch { }
  changed_when: false
  failed_when: false

# --- Proxmox guest agent (was VirtualBox guest additions) -------------------
# The qemu-ga MSI ships on the virtio-win ISO. If that ISO is still attached it
# is the simplest source; otherwise install it out of band and set
# qemu_ga_installed=true to skip.
- name: "Look for the qemu guest-agent MSI on any attached CD"
  ansible.windows.win_shell: |
    $msi = Get-PSDrive -PSProvider FileSystem |
      ForEach-Object { Join-Path $_.Root 'guest-agent\qemu-ga-x86_64.msi' } |
      Where-Object { Test-Path $_ } | Select-Object -First 1
    if ($msi) { $msi } else { '' }
  register: qemu_ga_msi
  changed_when: false

- name: "Install qemu guest agent (optional; best-effort)"
  ansible.windows.win_package:
    path: "{{ qemu_ga_msi.stdout | trim }}"
    state: present
  when: (qemu_ga_msi.stdout | trim) | length > 0
  register: qemu_ga_install
  failed_when: false

- name: "Note if the guest agent did not install"
  ansible.builtin.debug:
    msg: >-
      qemu guest agent did not install cleanly (rc
      {{ qemu_ga_install.rc | default('n/a') }}). NON-FATAL: the agent is only a
      Proxmox convenience (guest IP in the GUI, graceful shutdown) and is not
      needed by WinRM, the domain, or the exploit chain. The newest virtio-win
      qemu-ga service will not start on 2008 R2 / Win7 (needs a newer OS); use an
      older virtio-win build by hand if you want the agent on those guests.
  when:
    - qemu_ga_install is defined
    - (qemu_ga_install.rc | default(0)) != 0

- name: "Ensure the QEMU-GA service is running (if the agent installed)"
  ansible.windows.win_service:
    name: QEMU-GA
    state: started
    start_mode: auto
  failed_when: false

# --- RDP + Chocolatey (reuse the existing scripts) --------------------------
- name: "Enable RDP"
  ansible.windows.win_shell: "{{ guest_stage_dir }}\\scripts\\enable-rdp.bat"
  args:
    executable: cmd
  changed_when: true

- name: "Install Chocolatey"
  ansible.builtin.include_tasks: run_ps_scripts.yml
  vars:
    ps_scripts:
      - "Install-Chocolatey.ps1"

# Chocolatey adds C:\ProgramData\chocolatey\bin to the machine PATH, but the
# running WinRM service captured its environment at boot, so shells it spawns
# for later tasks/plays do NOT see choco on PATH until WinRM is restarted. A
# reboot is the reliable way to refresh that, so the target's KB/tool installs
# and danderspritz's Install-Git (all call choco.exe) can find it.
- name: "Reboot so Chocolatey is on PATH for later WinRM sessions"
  ansible.windows.win_reboot:
    reboot_timeout: 900

# --- Re-arm the trial licence (buys another 90 days) ------------------------
- name: "slmgr /rearm (best effort)"
  ansible.windows.win_shell: "cscript //nologo C:\\Windows\\System32\\slmgr.vbs /rearm"
  failed_when: false
  changed_when: true
