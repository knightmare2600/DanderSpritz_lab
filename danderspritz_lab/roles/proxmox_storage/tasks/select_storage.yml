---
# Non-recursive. Validate _sel_current against _sel_candidates; if it isn't
# valid, prompt ONCE (default = first candidate). Always set _sel_result, then
# assert it is valid — a bad manual entry fails with guidance rather than looping
# (recursion here is a trap: a block/include `when` propagates into the included
# tasks and flips mid-flight once a fact is mutated).

- name: "storage | is '{{ _sel_current }}' a valid {{ _sel_kind }} storage?"
  ansible.builtin.set_fact:
    _sel_ok: "{{ _sel_current in _sel_candidates }}"

- name: "storage | choose a {{ _sel_kind }} storage"
  when: not (_sel_ok | bool)
  block:
    - name: "storage | prompt for a {{ _sel_kind }} storage"
      ansible.builtin.pause:
        prompt: |

          Storage '{{ _sel_current }}' is not {{ _sel_kind }}-capable on {{ proxmox_node }}.
          Available {{ _sel_kind }} storage: {{ _sel_candidates | join(', ') }}
          Enter one to use [{{ _sel_candidates[0] }}]
      register: _storage_prompt

    - name: "storage | adopt the choice (Enter = {{ _sel_candidates[0] }})"
      ansible.builtin.set_fact:
        _sel_current: "{{ (_storage_prompt.user_input | trim) or _sel_candidates[0] }}"

- name: "storage | record the chosen {{ _sel_kind }} storage"
  ansible.builtin.set_fact:
    _sel_result: "{{ _sel_current }}"

- name: "storage | the chosen {{ _sel_kind }} storage must be valid"
  ansible.builtin.assert:
    that:
      - _sel_result in _sel_candidates
    fail_msg: >-
      '{{ _sel_result }}' is not a {{ _sel_kind }}-capable storage on
      {{ proxmox_node }}. Valid: {{ _sel_candidates | join(', ') }}. Re-run and
      pick one, or set proxmox_{{ 'disk' if _sel_kind == 'images' else 'iso' }}_storage.
    quiet: true
