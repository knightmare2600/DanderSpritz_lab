---
# Windows 10 (1507) DanderSpritz / FuzzBunch workstation. Mirrors the Packer
# Win10 build: hardening-off + telemetry-off, then the toolchain (Git, JRE6,
# Python, WinPython, DanderSpritz) and the D: virtual drive it runs from.

- name: "DSZ | low-security settings and debloat"
  ansible.builtin.include_role:
    name: common_windows
    tasks_from: run_ps_scripts
  vars:
    ps_scripts:
      - "Win10\\Set-PowerSettings.ps1"
      - "Win10\\Set-WindowsTelemetrySettings.ps1"
      - "Win10\\Set-LowSecurityWindowsDefenderAntiVirusSettings.ps1"
      - "Win10\\Set-LowSecurityWindowsDefenderSmartScreenSettings.ps1"
      - "Win10\\Remove-PreInstalledApps.ps1"

- name: "DSZ | reboot after defender / telemetry changes"
  ansible.windows.win_reboot:
    reboot_timeout: 900

# Copy the vendored installers off the tools CD to exactly where the
# Install-*.ps1 scripts look (they use the local file if present, else download).
# Best-effort: if no tools CD is attached, each is reported "not on CD" and the
# scripts fall back to their download.
- name: "DSZ | stage vendored installers from the tools CD (if attached)"
  ansible.windows.win_shell: |
    $src = Get-PSDrive -PSProvider FileSystem |
      ForEach-Object { Join-Path $_.Root '{{ item.src }}' } |
      Where-Object { Test-Path $_ } | Select-Object -First 1
    if ($src) { Copy-Item -LiteralPath $src -Destination '{{ item.dest }}' -Force; "staged {{ item.src }}" }
    else { "not on CD, will download: {{ item.src }}" }
  loop: "{{ danderspritz_tools }}"
  loop_control:
    label: "{{ item.src }}"
  changed_when: true

- name: "DSZ | stage the DanderSpritz toolset zip from the tools CD (if present)"
  ansible.windows.win_shell: |
    $src = Get-PSDrive -PSProvider FileSystem |
      ForEach-Object { Join-Path $_.Root '{{ eqgrp_zip_name }}' } |
      Where-Object { Test-Path $_ } | Select-Object -First 1
    if ($src) { Copy-Item -LiteralPath $src -Destination 'C:\Windows\Temp\{{ eqgrp_zip_name }}' -Force; "staged {{ eqgrp_zip_name }}" }
    else { "not on CD, Install-DanderSpritz will git clone instead" }
  changed_when: true

- name: "DSZ | install the DanderSpritz toolchain"
  ansible.builtin.include_role:
    name: common_windows
    tasks_from: run_ps_scripts
  vars:
    ps_scripts:
      - "Install-Git.ps1"
      - "Win10\\Install-jre6u21.ps1"
      - "Win10\\Install-python.ps1"
      - "Win10\\Install-winpy32.ps1"
      - "Win10\\Install-DanderSpritz.ps1"
      - "autologon.ps1"
      - "Win10\\virtual-drive.ps1"

- name: "DSZ | final reboot"
  ansible.windows.win_reboot:
    reboot_timeout: 900
