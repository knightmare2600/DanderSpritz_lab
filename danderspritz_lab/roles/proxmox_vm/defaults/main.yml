---
# Local working area on the control node for building the per-VM answer-file and
# tools ISOs. Under tools/ (a roomy repo dir), NOT /tmp: the target's tools ISO
# carries SP1 and is ~1 GB, which needs a couple of GB of staging+output space
# that a small /tmp does not have (genisoimage fails "No space left on device").
# Override with -e proxmox_vm_build_dir=/some/path if you want it elsewhere.
proxmox_vm_build_dir: "{{ tools_dir }}/.build"

# Candidate drive letters for the virtio-win CD during the windowsPE pass. With
# four optical drives attached (install + unattend + tools + virtio), WinPE's
# letter for the virtio CD isn't predictable, so <DriverPaths> is emitted for
# ALL of these — whichever one the virtio CD actually is gets the driver loaded,
# and the rest are harmlessly skipped by Setup. Widen the range if your layout
# needs it; a wrong/extra letter is not fatal.
virtio_winpe_drives:
  - "C:"
  - "D:"
  - "E:"
  - "F:"
  - "G:"
  - "H:"

# Per-OS virtio-win driver sub-paths (relative to the virtio CD root). Keys are
# lab_vms[].os_short. vioscsi = storage (needed in windowsPE to see the disk),
# NetKVM = network, Balloon = memory. amd64 throughout (all guests are x64).
virtio_driver_subpaths:
  "2k8R2":
    - "vioscsi\\2k8R2\\amd64"
    - "NetKVM\\2k8R2\\amd64"
    - "Balloon\\2k8R2\\amd64"
  "w7":
    - "vioscsi\\w7\\amd64"
    - "NetKVM\\w7\\amd64"
    - "Balloon\\w7\\amd64"
  "w10":
    - "vioscsi\\w10\\amd64"
    - "NetKVM\\w10\\amd64"
    - "Balloon\\w10\\amd64"
