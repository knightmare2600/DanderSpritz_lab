---
# Create one Proxmox VM from a pre-staged Windows ISO + a generated answer-file
# ISO, with virtio drivers injected so Setup can see the disk.
#
# Invoked per-VM from build.yml with loop_var `vm`. Runs on the control node;
# all Proxmox calls go over the API.

- name: "{{ vm.name }} | check whether the VM already exists"
  community.general.proxmox_vm_info:
    api_host: "{{ proxmox_api_host }}"
    api_user: "{{ proxmox_api_user }}"
    api_token_id: "{{ _pve_module_auth.api_token_id | default(omit) }}"
    api_token_secret: "{{ _pve_module_auth.api_token_secret | default(omit) }}"
    api_password: "{{ _pve_module_auth.api_password | default(omit) }}"
    validate_certs: "{{ proxmox_validate_certs }}"
    node: "{{ proxmox_node }}"
    vmid: "{{ vm.vmid }}"
  register: vm_existing
  failed_when: false

- name: "{{ vm.name }} | skip build (VM already present)"
  ansible.builtin.debug:
    msg: "vmid {{ vm.vmid }} already exists - leaving it alone. Destroy it first to rebuild."
  when: (vm_existing.proxmox_vms | default([]) | length) > 0

- name: "{{ vm.name }} | build and register the VM"
  when: (vm_existing.proxmox_vms | default([]) | length) == 0
  block:
    # --- Build the answer-file ISO on the control node --------------------
    - name: "{{ vm.name }} | local work dir"
      ansible.builtin.file:
        path: "{{ proxmox_vm_build_dir }}/{{ vm.name }}/iso_root"
        state: directory
        mode: "0755"

    - name: "{{ vm.name }} | render Autounattend.xml (virtio drivers injected)"
      ansible.builtin.template:
        src: "{{ vm.os_short }}-Autounattend.xml.j2"
        dest: "{{ proxmox_vm_build_dir }}/{{ vm.name }}/iso_root/Autounattend.xml"
        mode: "0644"

    - name: "{{ vm.name }} | build the answer-file ISO (label must be unattended media)"
      ansible.builtin.command:
        cmd: >-
          genisoimage -quiet -J -r -V UNATTENDED
          -o {{ proxmox_vm_build_dir }}/{{ vm.name }}-unattend.iso
          {{ proxmox_vm_build_dir }}/{{ vm.name }}/iso_root
      changed_when: true

    # --- Upload it into Proxmox ISO storage via the API ------------------
    # curl (not uri): the uri module's file lookup reads as text and corrupts a
    # binary ISO. -F '...=@file' sends it correctly. argv form avoids shell
    # quoting and lets the auth args (_pve_curl_auth: token header, or cookie +
    # CSRF in password mode) be spliced in cleanly.
    - name: "{{ vm.name }} | upload answer-file ISO to {{ proxmox_iso_storage }}"
      ansible.builtin.command:
        argv: >-
          {{ ['curl', '--fail', '--silent', '--show-error']
             + (['--insecure'] if not proxmox_validate_certs else [])
             + _pve_curl_auth
             + ['--form-string', 'content=iso',
                '-F', 'filename=@' ~ proxmox_vm_build_dir ~ '/' ~ vm.name ~ '-unattend.iso;type=application/octet-stream',
                'https://' ~ proxmox_api_host ~ ':8006/api2/json/nodes/' ~ proxmox_node ~ '/storage/' ~ proxmox_iso_storage ~ '/upload'] }}
      no_log: true          # keep the API secret out of logs
      changed_when: true

    # --- Optional tools CD: vendored installers from ../tools -------------
    - name: "{{ vm.name }} | build + upload the tools CD"
      when: vm.tools_iso | default(false)
      block:
        - name: "{{ vm.name }} | tools ISO staging dir"
          ansible.builtin.file:
            path: "{{ proxmox_vm_build_dir }}/{{ vm.name }}/tools_root"
            state: directory
            mode: "0755"

        # Copy only the mapped files (so a stray wrong-arch file in tools/ is
        # never included).
        - name: "{{ vm.name }} | stage mapped installers into the tools ISO root"
          ansible.builtin.copy:
            src: "{{ tools_dir }}/{{ item.src }}"
            dest: "{{ proxmox_vm_build_dir }}/{{ vm.name }}/tools_root/{{ item.src }}"
            remote_src: true
            mode: "0644"
          loop: "{{ vm.vendored_tools | default([]) }}"
          loop_control:
            label: "{{ item.src }}"

        # The DanderSpritz toolset (EQGRP) and Win7 SP1 are too big for the repo:
        # fetch them once (cached) on the control node and bake them onto the CD.
        - name: "{{ vm.name }} | ensure the download cache dir exists"
          ansible.builtin.file:
            path: "{{ eqgrp_cache_dir }}"
            state: directory
            mode: "0755"
          when: (vm.fetch_eqgrp | default(false)) or (vm.fetch_sp1 | default(false))

        - name: "{{ vm.name }} | download the DanderSpritz toolset (cached)"
          ansible.builtin.get_url:
            url: "{{ eqgrp_url }}"
            dest: "{{ eqgrp_cache_dir }}/{{ eqgrp_zip_name }}"
            force: false
            timeout: 120
            mode: "0644"
          when: vm.fetch_eqgrp | default(false)

        - name: "{{ vm.name }} | add the toolset zip to the tools ISO root"
          ansible.builtin.copy:
            src: "{{ eqgrp_cache_dir }}/{{ eqgrp_zip_name }}"
            dest: "{{ proxmox_vm_build_dir }}/{{ vm.name }}/tools_root/{{ eqgrp_zip_name }}"
            remote_src: true
            mode: "0644"
          when: vm.fetch_eqgrp | default(false)

        # Win7 SP1: prefer a copy vendored in tools/ (Microsoft removed the
        # original download); otherwise fetch it from the Internet Archive,
        # checksum-verified. Either way it is baked onto this VM's tools CD.
        - name: "{{ vm.name }} | is Win7 SP1 vendored in tools/?"
          ansible.builtin.stat:
            path: "{{ tools_dir }}/{{ sp1_file_name }}"
          register: _sp1_vendored
          when: vm.fetch_sp1 | default(false)

        - name: "{{ vm.name }} | download Win7 SP1 from the Internet Archive (if not vendored)"
          ansible.builtin.get_url:
            url: "{{ sp1_url }}"
            dest: "{{ sp1_cache_dir }}/{{ sp1_file_name }}"
            checksum: "sha256:{{ sp1_sha256 }}"
            force: false
            timeout: 120
            mode: "0644"
          when:
            - vm.fetch_sp1 | default(false)
            - not (_sp1_vendored.stat.exists | default(false))

        - name: "{{ vm.name }} | add Win7 SP1 to the tools ISO root"
          ansible.builtin.copy:
            src: "{{ (tools_dir ~ '/' ~ sp1_file_name) if (_sp1_vendored.stat.exists | default(false)) else (sp1_cache_dir ~ '/' ~ sp1_file_name) }}"
            dest: "{{ proxmox_vm_build_dir }}/{{ vm.name }}/tools_root/{{ sp1_file_name }}"
            remote_src: true
            mode: "0644"
          when: vm.fetch_sp1 | default(false)

        - name: "{{ vm.name }} | build the tools ISO"
          ansible.builtin.command:
            cmd: >-
              genisoimage -quiet -J -r -V TOOLS
              -o {{ proxmox_vm_build_dir }}/{{ vm.name }}-tools.iso
              {{ proxmox_vm_build_dir }}/{{ vm.name }}/tools_root
          changed_when: true

        - name: "{{ vm.name }} | upload tools ISO to {{ proxmox_iso_storage }}"
          ansible.builtin.command:
            argv: >-
              {{ ['curl', '--fail', '--silent', '--show-error']
                 + (['--insecure'] if not proxmox_validate_certs else [])
                 + _pve_curl_auth
                 + ['--form-string', 'content=iso',
                    '-F', 'filename=@' ~ proxmox_vm_build_dir ~ '/' ~ vm.name ~ '-tools.iso;type=application/octet-stream',
                    'https://' ~ proxmox_api_host ~ ':8006/api2/json/nodes/' ~ proxmox_node ~ '/storage/' ~ proxmox_iso_storage ~ '/upload'] }}
          register: _tools_upload
          no_log: true
          changed_when: true

        # The upload endpoint returns a task id (UPID) and copies the (large)
        # file into storage asynchronously. Wait for THAT task to finish — a
        # file-listing check passes too early for a 240MB ISO.
        - name: "{{ vm.name }} | wait for the tools ISO upload task to finish"
          ansible.builtin.uri:
            url: "https://{{ proxmox_api_host }}:8006/api2/json/nodes/{{ proxmox_node }}/tasks/{{ (_tools_upload.stdout | from_json).data }}/status"
            method: GET
            headers: "{{ _pve_get_headers }}"
            validate_certs: "{{ proxmox_validate_certs }}"
          register: _tools_task
          until: _tools_task.json.data.status == 'stopped'
          retries: 60
          delay: 5
          no_log: true

        - name: "{{ vm.name }} | the tools ISO upload task must have succeeded"
          ansible.builtin.assert:
            that:
              - _tools_task.json.data.exitstatus | default('') == 'OK'
            fail_msg: >-
              The tools ISO upload task did not succeed
              (exitstatus={{ _tools_task.json.data.exitstatus | default('unknown') }}).
              A ~240MB upload through the PVE API can be unreliable; consider
              fetch_eqgrp=false (smaller CD, guest clones the toolset) or staging
              the ISO on the node another way.
            quiet: true

    # The upload API returns as soon as curl's request is accepted, but a large
    # volume (the tools ISO) can take a moment to register in storage. Wait for
    # the uploaded ISOs to actually appear before referencing them in the VM.
    - name: "{{ vm.name }} | wait for the uploaded ISOs to register in storage"
      ansible.builtin.uri:
        url: "https://{{ proxmox_api_host }}:8006/api2/json/nodes/{{ proxmox_node }}/storage/{{ proxmox_iso_storage }}/content?content=iso"
        method: GET
        headers: "{{ _pve_get_headers }}"
        validate_certs: "{{ proxmox_validate_certs }}"
      register: _iso_registered
      vars:
        _expected_uploaded: "{{ [vm.name ~ '-unattend.iso'] + ([vm.name ~ '-tools.iso'] if (vm.tools_iso | default(false)) else []) }}"
      until: >-
        (_expected_uploaded | difference(_iso_registered.json.data
          | map(attribute='volid') | map('regex_replace', '^.*/', '') | list)) | length == 0
      retries: 40
      delay: 5
      no_log: true

    # --- Assemble the CD drive list (tools CD on ide3 when present) --------
    - name: "{{ vm.name }} | assemble IDE cdrom drives"
      ansible.builtin.set_fact:
        _ide_drives: >-
          {{ {
               'ide2': proxmox_iso_storage ~ ':iso/' ~ vm.iso ~ ',media=cdrom',
               'ide0': proxmox_iso_storage ~ ':iso/' ~ vm.name ~ '-unattend.iso,media=cdrom'
             } | combine(
               {'ide3': proxmox_iso_storage ~ ':iso/' ~ vm.name ~ '-tools.iso,media=cdrom'}
               if (vm.tools_iso | default(false)) else {}
             ) }}

    # --- Create the VM ----------------------------------------------------
    - name: "{{ vm.name }} | create VM (virtio-scsi disk, virtio net, CDs)"
      community.general.proxmox_kvm:
        api_host: "{{ proxmox_api_host }}"
        api_user: "{{ proxmox_api_user }}"
        api_token_id: "{{ _pve_module_auth.api_token_id | default(omit) }}"
        api_token_secret: "{{ _pve_module_auth.api_token_secret | default(omit) }}"
        api_password: "{{ _pve_module_auth.api_password | default(omit) }}"
        validate_certs: "{{ proxmox_validate_certs }}"
        node: "{{ proxmox_node }}"
        vmid: "{{ vm.vmid }}"
        name: "dsz-{{ vm.name }}"
        ostype: "{{ vm.ostype }}"
        bios: seabios
        cores: "{{ vm.cores }}"
        memory: "{{ vm.memory }}"
        balloon: 0
        scsihw: virtio-scsi-single
        scsi:
          scsi0: "{{ proxmox_disk_storage }}:{{ vm.disk_gb }},cache=writeback"
        # ide2 = install media (bootable fallback once disk is empty), ide0 =
        # answer file (Setup auto-scans removable media), ide3 = tools CD if any.
        ide: "{{ _ide_drives }}"
        sata:
          # virtio-win drivers, lettered in WinPE (see virtio_winpe_drives).
          sata0: "{{ proxmox_iso_storage }}:iso/{{ proxmox_virtio_iso }},media=cdrom"
        net:
          # Fixed MAC (so the gateway's DHCP can reserve the right IP in routed
          # mode). In 'tagged' mode the NIC also carries VLAN lab_vlan.
          net0: "virtio,bridge={{ proxmox_lab_bridge }}{{ (',macaddr=' ~ vm.mac) if (vm.mac is defined) else '' }}{{ (',tag=' ~ lab_vlan) if (lab_network_mode == 'tagged' and (lab_vlan | string | length > 0)) else '' }}"
        # Disk first: empty disk falls through to CD for the install, then boots
        # the installed bootloader on every reboot - no install loop, no CD eject.
        boot: "order=scsi0;ide2"
        agent: enabled=1
        onboot: false
        state: present

    - name: "{{ vm.name }} | power on"
      community.general.proxmox_kvm:
        api_host: "{{ proxmox_api_host }}"
        api_user: "{{ proxmox_api_user }}"
        api_token_id: "{{ _pve_module_auth.api_token_id | default(omit) }}"
        api_token_secret: "{{ _pve_module_auth.api_token_secret | default(omit) }}"
        api_password: "{{ _pve_module_auth.api_password | default(omit) }}"
        validate_certs: "{{ proxmox_validate_certs }}"
        node: "{{ proxmox_node }}"
        vmid: "{{ vm.vmid }}"
        state: started
