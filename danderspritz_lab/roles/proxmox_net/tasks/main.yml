---
# Ensure an isolated lab bridge exists, creating it only if its name is free.
# Runs on the control node (uses the Proxmox API); expects the proxmox_* vars
# and the shared _pve_* auth facts published by roles/proxmox_auth.

- name: "net | resolve a free bridge name, then create it"
  when: lab_network_mode == 'managed'
  block:
    # Phase 1: settle on a bridge name that is NOT already in use (may prompt
    # and recurse). Only sets proxmox_lab_bridge; does not create anything.
    - name: "net | find an unused bridge name"
      ansible.builtin.include_tasks: resolve_bridge_name.yml

    # Phase 2: create that bridge, once — unless phase 1 found it already exists
    # and is ours (then we just reuse it).
    - name: "net | create the isolated bridge '{{ proxmox_lab_bridge }}'"
      ansible.builtin.include_tasks: create_bridge.yml
      when: _pve_bridge_create_needed | default(true)
