---
# Non-recursive. Classify proxmox_lab_bridge; if a FOREIGN bridge (no
# lab_bridge_comment) holds the name, prompt ONCE for a different vmbrN and
# re-classify. Sets _pve_bridge_create_needed. A still-conflicting choice fails
# with guidance rather than looping (recursion with a mutating `when` is a trap).

- name: "net | list existing bridges on {{ proxmox_node }}"
  ansible.builtin.uri:
    url: "https://{{ proxmox_api_host }}:8006/api2/json/nodes/{{ proxmox_node }}/network?type=any_bridge"
    method: GET
    headers: "{{ _pve_get_headers }}"
    validate_certs: "{{ proxmox_validate_certs }}"
  register: net_bridges
  no_log: true

- name: "net | classify '{{ proxmox_lab_bridge }}'"
  ansible.builtin.set_fact:
    _bridge_present: "{{ proxmox_lab_bridge in (net_bridges.json.data | map(attribute='iface') | list) }}"
    _bridge_is_ours: "{{ lab_bridge_comment in (net_bridges.json.data | selectattr('iface', 'equalto', proxmox_lab_bridge) | map(attribute='comments') | list | first | default('')) }}"

- name: "net | '{{ proxmox_lab_bridge }}' is a foreign bridge — choose a different name"
  when: _bridge_present and not _bridge_is_ours
  block:
    - name: "net | prompt for an unused bridge name"
      ansible.builtin.pause:
        prompt: |

          Bridge '{{ proxmox_lab_bridge }}' already exists on {{ proxmox_node }}, is not one this
          lab created (no '{{ lab_bridge_comment }}' comment), and will NOT be reused or modified.
          Existing bridges: {{ net_bridges.json.data | map(attribute='iface') | join(', ') }}
          Enter a DIFFERENT, unused Proxmox bridge name (must be vmbrN, e.g. vmbr41)
      register: _bridge_prompt

    - name: "net | adopt the new name"
      ansible.builtin.set_fact:
        proxmox_lab_bridge: "{{ _bridge_prompt.user_input | trim }}"

    - name: "net | re-list bridges for the new name"
      ansible.builtin.uri:
        url: "https://{{ proxmox_api_host }}:8006/api2/json/nodes/{{ proxmox_node }}/network?type=any_bridge"
        method: GET
        headers: "{{ _pve_get_headers }}"
        validate_certs: "{{ proxmox_validate_certs }}"
      register: net_bridges2
      no_log: true

    - name: "net | re-classify the new name"
      ansible.builtin.set_fact:
        _bridge_present: "{{ proxmox_lab_bridge in (net_bridges2.json.data | map(attribute='iface') | list) }}"
        _bridge_is_ours: "{{ lab_bridge_comment in (net_bridges2.json.data | selectattr('iface', 'equalto', proxmox_lab_bridge) | map(attribute='comments') | list | first | default('')) }}"

- name: "net | the chosen bridge must be free or ours"
  ansible.builtin.assert:
    that:
      - not (_bridge_present and not _bridge_is_ours)
    fail_msg: >-
      '{{ proxmox_lab_bridge }}' is in use by another bridge on {{ proxmox_node }}.
      Re-run and choose a free vmbrN, or set proxmox_lab_bridge.
    quiet: true

- name: "net | decide whether the bridge needs creating"
  ansible.builtin.set_fact:
    # Create only when it does not already exist; an existing-and-ours bridge is
    # reused as-is.
    _pve_bridge_create_needed: "{{ not _bridge_present }}"
