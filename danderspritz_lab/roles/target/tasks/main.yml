---
# Windows 7 target workstation. Mirrors the Packer Target build (prereq KBs ->
# SP1 -> more KBs -> FLARE RE tooling) then the Vagrant provision (domain join,
# local admin, tools-folder link).
#
# Deliberately left under-patched beyond what's listed here: EternalBlue needs
# an unpatched SMBv1. Do not add Windows Update.

# --- Batch prep: tools folder + firewall off --------------------------------
- name: "Target | create tools folder"
  ansible.windows.win_shell: "{{ guest_stage_dir }}\\scripts\\Target\\create-tools-folder.bat"
  args:
    executable: cmd
  changed_when: true

- name: "Target | disable firewall"
  ansible.windows.win_shell: "{{ guest_stage_dir }}\\scripts\\Target\\disable_firewall.bat"
  args:
    executable: cmd
  changed_when: true

# --- Pre-SP1 prerequisite hotfixes ------------------------------------------
- name: "Target | prerequisite KBs"
  ansible.builtin.include_role:
    name: common_windows
    tasks_from: run_ps_scripts
  vars:
    ps_scripts:
      - "Target\\Install-KB2454826.ps1"
      - "Target\\Install-KB2534366.ps1"
      - "Target\\Install-KB2533552.ps1"

- name: "Target | reboot after prerequisite KBs"
  ansible.windows.win_reboot:
    reboot_timeout: 900

# --- Service Pack 1 (long) --------------------------------------------------
# Microsoft removed the original KB976932 download. Acquire SP1 into
# C:\Windows\Temp\KB976932-X64.exe the cheapest safe way: from the tools CD if
# one is attached (rebuilt target), else download it from sp1_url (Internet
# Archive) directly on the guest. EITHER way the file is SHA-256-verified before
# install, so a truncated/garbled copy is caught here, not installed. Override
# sp1_url with a LAN HTTP URL to serve a vendored copy from the control node and
# skip the ~900 MB pull over the lab NAT.
- name: "Target | stage Win7 SP1 from the tools CD (if attached)"
  ansible.windows.win_shell: |
    $src = Get-PSDrive -PSProvider FileSystem |
      ForEach-Object { Join-Path $_.Root '{{ sp1_file_name }}' } |
      Where-Object { Test-Path $_ } | Select-Object -First 1
    if ($src) { Copy-Item -LiteralPath $src -Destination 'C:\Windows\Temp\KB976932-X64.exe' -Force; "staged SP1 from CD" }
    else { "SP1 not on CD" }
  register: _sp1_cd
  changed_when: "'staged SP1 from CD' in _sp1_cd.stdout"

- name: "Target | is SP1 present after CD staging?"
  ansible.windows.win_stat:
    path: 'C:\Windows\Temp\KB976932-X64.exe'
  register: _sp1_staged

- name: "Target | download Win7 SP1 (checksum-verified) if not on the CD"
  ansible.windows.win_get_url:
    url: "{{ sp1_url }}"
    dest: 'C:\Windows\Temp\KB976932-X64.exe'
    checksum: "{{ sp1_sha256 }}"
    checksum_algorithm: sha256
    timeout: 600
  when: not _sp1_staged.stat.exists

- name: "Target | verify the SP1 installer SHA-256 (CD or download)"
  ansible.windows.win_stat:
    path: 'C:\Windows\Temp\KB976932-X64.exe'
    get_checksum: true
    checksum_algorithm: sha256
  register: _sp1_final

- name: "Target | SP1 installer must match the expected SHA-256"
  ansible.builtin.assert:
    that:
      - _sp1_final.stat.exists
      - _sp1_final.stat.checksum == sp1_sha256
    fail_msg: >-
      C:\Windows\Temp\KB976932-X64.exe SHA-256 is
      {{ _sp1_final.stat.checksum | default('(file missing)') }}, expected
      {{ sp1_sha256 }}. The vendored/downloaded SP1 is wrong or corrupt — do not
      install it. Re-fetch from {{ sp1_url }} and confirm the hash.
    quiet: true

- name: "Target | install SP1"
  ansible.builtin.include_role:
    name: common_windows
    tasks_from: run_ps_scripts
  vars:
    ps_scripts:
      - "Target\\Install-SP1.ps1"

- name: "Target | reboot after SP1 (can be very slow)"
  ansible.windows.win_reboot:
    reboot_timeout: 2400
    post_reboot_delay: 120

# --- Post-SP1 KBs -----------------------------------------------------------
- name: "Target | post-SP1 KBs"
  ansible.builtin.include_role:
    name: common_windows
    tasks_from: run_ps_scripts
  vars:
    ps_scripts:
      - "Target\\Install-KB3035131.ps1"
      - "Target\\Install-KB3033929.ps1"
      - "Target\\Install-KB2999226.ps1"

- name: "Target | reboot after post-SP1 KBs"
  ansible.windows.win_reboot:
    reboot_timeout: 1200

# --- Essential tooling (from the Chocolatey community feed; must succeed) ----
- name: "Target | vcredist, Sysinternals, Sysmon, hostname, autologon"
  ansible.builtin.include_role:
    name: common_windows
    tasks_from: run_ps_scripts
  vars:
    ps_scripts:
      - "Target\\Install-vcredist2015.ps1"
      - "Target\\show-hidden-files.ps1"
      - "Target\\Install-Sysinternals.ps1"
      - "Target\\Install-Sysmon.ps1"
      - "Target\\Set-Hostname.ps1"
      - "autologon.ps1"

# --- FLARE reversing toolset (OPTIONAL, best-effort) ------------------------
# The old FLARE myget feed (myget.org/F/flare) now serves none of these
# packages, and current FLARE-VM requires Windows >= 10, so on this Win7 target
# these installs are expected to fail. They are optional analysis tooling, not
# part of the exploit chain, so a failure here must NOT abort the build or block
# the domain join. Set target_install_flare: false to skip them entirely.
- name: "Target | FLARE RE tooling (optional; feed may be dead)"
  when: target_install_flare | bool
  block:
    - name: "Target | add FLARE repo and install RE tools (non-fatal)"
      ansible.builtin.include_role:
        name: common_windows
        tasks_from: run_ps_scripts
      vars:
        ps_ignore_errors: true     # attempt each; never fatal
        ps_scripts:
          - "Target\\Set-ChocolateyFLARERepo.ps1"
          - "Target\\Install-FLAREAPIMonitor.ps1"
          - "Target\\Install-FLAREEXEInfoPE.ps1"
          - "Target\\Install-FLAREHXD.ps1"
          - "Target\\Install-FLAREPEID.ps1"
          - "Target\\Install-FLAREPEView.ps1"
          - "Target\\Install-FLAREWindbg.ps1"
          - "Target\\Install-FLAREWireshark.ps1"
          - "Target\\Install-FLAREBinaryNinja.ps1"
          - "Target\\Install-FLAREHashCalc.ps1"
          - "Target\\Install-FLAREIDAFree.ps1"
          - "Target\\Install-FLAREOllydbg2.ps1"

- name: "Target | reboot before domain join"
  ansible.windows.win_reboot:
    reboot_timeout: 900

# --- Join the domain (was the Vagrant target provisioner) -------------------
- name: "Target | join windomain.local"
  ansible.builtin.include_role:
    name: common_windows
    tasks_from: run_ps_scripts
  vars:
    ps_scripts:
      - "Target\\Join-domain.ps1"

- name: "Target | reboot after domain join"
  ansible.windows.win_reboot:
    reboot_timeout: 900

- name: "Target | add domain local admin"
  ansible.builtin.include_role:
    name: common_windows
    tasks_from: run_ps_scripts
  vars:
    ps_scripts:
      - "Target\\Add-local-admin.ps1"

- name: "Target | reboot after local-admin change"
  ansible.windows.win_reboot:
    reboot_timeout: 900

- name: "Target | create the tools-folder link"
  ansible.builtin.include_role:
    name: common_windows
    tasks_from: run_ps_scripts
  vars:
    ps_scripts:
      - "Target\\Create-tools-folder-link.ps1"
