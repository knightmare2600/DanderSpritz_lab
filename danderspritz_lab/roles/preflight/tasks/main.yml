---
# Preflight checks for the selected VMs, run on the control node before any VM
# is created. Fails early and loudly on the things that otherwise waste a long
# build: a missing ISO, a case/spelling mismatch in the filename, or the wrong
# ISO entirely (SHA-256).
#
# Expects (from the build.yml play): _selected_vms, and the proxmox_* vars incl.
# the shared _pve_* auth facts published by roles/proxmox_auth.

- name: "preflight | list ISO volumes in storage '{{ proxmox_iso_storage }}'"
  ansible.builtin.uri:
    url: "https://{{ proxmox_api_host }}:8006/api2/json/nodes/{{ proxmox_node }}/storage/{{ proxmox_iso_storage }}/content?content=iso"
    method: GET
    headers: "{{ _pve_get_headers }}"
    validate_certs: "{{ proxmox_validate_certs }}"
    return_content: true
  register: pf_iso_list
  no_log: true          # response is fine, but the Authorization header is not
  when: preflight_check_isos | bool

- name: "preflight | work out what is present vs required"
  ansible.builtin.set_fact:
    # Strip the "storage:iso/" prefix down to the bare filename.
    pf_present: "{{ pf_iso_list.json.data | map(attribute='volid') | map('regex_replace', '^.*/', '') | list }}"
    pf_required: "{{ (_selected_vms | map(attribute='iso') | list) + [proxmox_virtio_iso] }}"
  when: preflight_check_isos | bool

- name: "preflight | every required ISO is present with the exact name"
  ansible.builtin.assert:
    that:
      - item in pf_present
    fail_msg: >-
      '{{ item }}' was not found with that exact name in storage
      '{{ proxmox_iso_storage }}'.
      {{ ('A case/spelling variant IS present: '
            + (pf_present | select('match', '(?i)^' + (item | regex_escape) + '$') | list | join(', '))
            + ' — rename it on the node to match exactly.')
         if (item | lower) in (pf_present | map('lower') | list)
         else ('Present ISOs: ' + (pf_present | join(', ') if (pf_present | length > 0) else '(none)')) }}
    success_msg: "{{ item }} — present"
    quiet: true
  loop: "{{ pf_required }}"
  when: preflight_check_isos | bool

# --- SHA-256 (only possible when Ansible is on the PVE node) ----------------
- name: "preflight | is pvesm available (i.e. are we on the PVE node)?"
  ansible.builtin.command: which pvesm
  register: pf_pvesm
  changed_when: false
  failed_when: false
  when: preflight_verify_sha256 | bool

- name: "preflight | SHA-256 verify the Windows ISOs"
  when:
    - preflight_verify_sha256 | bool
    - pf_pvesm.rc | default(1) == 0
  block:
    - name: "preflight | compute SHA-256 of each ISO on the node"
      ansible.builtin.shell: >-
        set -o pipefail;
        sha256sum "$(pvesm path {{ proxmox_iso_storage }}:iso/{{ item.iso }})" | awk '{ print $1 }'
      args:
        executable: /bin/bash
      changed_when: false
      register: pf_sha
      loop: "{{ _selected_vms | selectattr('iso_sha256', 'defined') | list }}"
      loop_control:
        label: "{{ item.iso }}"

    - name: "preflight | computed SHA-256 matches the expected value"
      ansible.builtin.assert:
        that:
          - (item.stdout | trim) == item.item.iso_sha256
        fail_msg: >-
          SHA-256 mismatch for {{ item.item.iso }} — this is the wrong or a
          corrupt ISO. Storage file: {{ item.stdout | trim }}.
          Expected: {{ item.item.iso_sha256 }}.
        success_msg: "{{ item.item.iso }} — SHA-256 OK"
        quiet: true
      loop: "{{ pf_sha.results }}"
      loop_control:
        label: "{{ item.item.iso }}"

- name: "preflight | note that SHA-256 verification was skipped"
  ansible.builtin.debug:
    msg: >-
      SHA-256 check skipped: `pvesm` not found, so Ansible is not running on the
      PVE node (or the ISO storage is not file-based). ISO presence and naming
      were still verified via the API; verify the hashes by hand with the
      commands in README.md if you want belt-and-braces.
  when:
    - preflight_verify_sha256 | bool
    - pf_pvesm.rc | default(1) != 0

# --- Vendored tools (read straight from the repo on the control node) -------
# The union of vendored_tools across the selected VMs (each must be present in
# tools/ with the right SHA-256). SP1 is handled separately below because it is
# fetched-if-absent, not mandatory in tools/.
- name: "preflight | gather vendored installers for the selected VMs"
  ansible.builtin.set_fact:
    _pf_vendored: "{{ _selected_vms | selectattr('vendored_tools', 'defined') | map(attribute='vendored_tools') | flatten | list }}"

- name: "preflight | check the vendored installers"
  when: (_pf_vendored | length) > 0
  block:
    - name: "preflight | stat + SHA-256 each vendored installer in {{ tools_dir }}"
      ansible.builtin.stat:
        path: "{{ tools_dir }}/{{ item.src }}"
        checksum_algorithm: sha256
      loop: "{{ _pf_vendored }}"
      register: pf_tools
      loop_control:
        label: "{{ item.src }}"

    - name: "preflight | each vendored installer exists with the expected SHA-256"
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.checksum == item.item.sha256
        fail_msg: >-
          {{ tools_dir }}/{{ item.item.src }}:
          {{ 'missing from the tools/ dir'
             if not item.stat.exists
             else ('SHA-256 ' + item.stat.checksum + ' does not match expected '
                   + item.item.sha256 + ' (wrong or corrupt file)') }}
        success_msg: "{{ item.item.src }} — present, SHA-256 OK"
        quiet: true
      loop: "{{ pf_tools.results }}"
      loop_control:
        label: "{{ item.item.src }}"

# --- Win7 SP1 (fetch-if-absent, so not mandatory in tools/) -----------------
- name: "preflight | check Win7 SP1 for the fetch_sp1 VMs"
  when: (_selected_vms | selectattr('fetch_sp1', 'defined') | selectattr('fetch_sp1') | list | length) > 0
  block:
    - name: "preflight | is Win7 SP1 vendored in tools/?"
      ansible.builtin.stat:
        path: "{{ tools_dir }}/{{ sp1_file_name }}"
        checksum_algorithm: sha256
      register: pf_sp1

    - name: "preflight | SP1 is a correct vendored file, or will be fetched"
      ansible.builtin.assert:
        that:
          - (not pf_sp1.stat.exists) or (pf_sp1.stat.checksum == sp1_sha256)
        fail_msg: >-
          {{ tools_dir }}/{{ sp1_file_name }} exists but its SHA-256
          ({{ pf_sp1.stat.checksum | default('?') }}) does not match the expected
          {{ sp1_sha256 }} — wrong or corrupt SP1 installer. Remove it to let the
          build fetch a verified copy from the Internet Archive instead.
        success_msg: >-
          {{ 'SP1 vendored in tools/ and SHA-256 OK'
             if pf_sp1.stat.exists
             else 'SP1 not vendored — will be fetched from the Internet Archive (SHA-256-verified) at build' }}
        quiet: true
