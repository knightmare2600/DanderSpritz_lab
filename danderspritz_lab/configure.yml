---
# Phase 2 — configure the Windows guests over WinRM. This replaces the Vagrant
# provisioning AND the config portion of the old Packer build.
#
# Order matters: common prep on all hosts, then the DC must be fully promoted
# before the Target can join the domain.

- name: Control-node prerequisites
  hosts: localhost
  gather_facts: false
  tasks:
    # Ansible's WinRM connection plugin needs the python 'winrm' module
    # (pywinrm) on the CONTROL node. Without it every Windows task fails with a
    # confusing connection error, so check it once here and fail loudly.
    - name: "Is pywinrm importable by this Ansible interpreter?"
      ansible.builtin.command: "{{ ansible_playbook_python }} -c \"import winrm\""
      changed_when: false
      failed_when: false
      register: _pywinrm_check

    - name: "pywinrm must be installed on the control node"
      ansible.builtin.assert:
        that:
          - _pywinrm_check.rc == 0
        fail_msg: >-
          The python 'winrm' module (pywinrm) is not available to this Ansible
          (interpreter: {{ ansible_playbook_python }}). The WinRM connection
          cannot work without it. Install it on the CONTROL node, e.g.
          `sudo apt install python3-winrm` (Debian/Ubuntu) or
          `pip install pywinrm`, then re-run.
        success_msg: "pywinrm present"
        quiet: true

    # The ntlm transport (the default, see group_vars/windows.yml) needs the
    # requests-ntlm module in addition to pywinrm. Only enforced when NTLM is
    # actually selected, so switching back to basic does not demand it.
    - name: "Work out which WinRM transport the windows hosts use"
      ansible.builtin.set_fact:
        _winrm_transport: "{{ hostvars[groups['windows'][0]].ansible_winrm_transport | default('basic') }}"
      when: (groups['windows'] | default([]) | length) > 0

    - name: "Is requests_ntlm importable by this Ansible interpreter?"
      ansible.builtin.command: "{{ ansible_playbook_python }} -c \"import requests_ntlm\""
      changed_when: false
      failed_when: false
      register: _ntlm_check
      when: (_winrm_transport | default('basic')) == 'ntlm'

    - name: "requests-ntlm must be installed when the ntlm transport is used"
      ansible.builtin.assert:
        that:
          - _ntlm_check.rc == 0
        fail_msg: >-
          ansible_winrm_transport is 'ntlm' but the python 'requests_ntlm'
          module is not available to this Ansible (interpreter:
          {{ ansible_playbook_python }}). Install it on the CONTROL node, e.g.
          `sudo apt install python3-requests-ntlm` (Debian/Ubuntu) or
          `pip install requests_ntlm`, then re-run — or set
          ansible_winrm_transport=basic to use the Basic transport instead.
        success_msg: "requests-ntlm present"
        quiet: true
      when: (_winrm_transport | default('basic')) == 'ntlm'

- name: Common Windows preparation (all guests)
  hosts: windows
  gather_facts: false
  vars_files:
    - "{{ lookup('ansible.builtin.first_found', ['group_vars/vault.yml'], errors='ignore') | default('group_vars/all.yml', true) }}"
  roles:
    - common_windows

- name: Build the Windows Server 2008 R2 domain controller
  hosts: dc
  gather_facts: false
  vars_files:
    - "{{ lookup('ansible.builtin.first_found', ['group_vars/vault.yml'], errors='ignore') | default('group_vars/all.yml', true) }}"
  roles:
    - domain_controller

- name: Build the Windows 7 target (joins the domain)
  hosts: target
  gather_facts: false
  vars_files:
    - "{{ lookup('ansible.builtin.first_found', ['group_vars/vault.yml'], errors='ignore') | default('group_vars/all.yml', true) }}"
  roles:
    - target

- name: Build the Windows 10 DanderSpritz workstation
  hosts: danderspritz
  gather_facts: false
  vars_files:
    - "{{ lookup('ansible.builtin.first_found', ['group_vars/vault.yml'], errors='ignore') | default('group_vars/all.yml', true) }}"
  roles:
    - danderspritz
